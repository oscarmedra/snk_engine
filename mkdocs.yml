site_name: Soninké — structure et corpus
site_description: Description de la langue soninké, moteur de conjugaison et corpus parallèle soninké-français
# site_url est ce qui remplit sitemap.xml et pose les liens canoniques : sans lui le
# sitemap sort vide et les moteurs n'ont aucune liste de pages à parcourir.
site_url: https://oscarmedra.github.io/snk_engine/
repo_url: https://github.com/oscarmedra/snk_engine
repo_name: oscarmedra/snk_engine
docs_dir: docs
theme:
  name: material
  language: fr
  custom_dir: overrides
  palette:
    - scheme: default
      primary: teal
      toggle: {icon: material/weather-night, name: Mode sombre}
    - scheme: slate
      primary: teal
      toggle: {icon: material/weather-sunny, name: Mode clair}
  features: [navigation.sections, navigation.top, content.code.copy, search.highlight]

nav:
  - Accueil: index.md
  - La langue:
      - L'orthographe: langue/orthographe.md
      - Les pronoms: langue/pronoms.md
      - La particule: langue/particule.md
      - Les temps: langue/temps.md
      - L'objet et la transitivité: langue/objet.md
      - Le nom: langue/nom.md
      - Être, avoir, la négation: langue/etre-avoir.md
      - Les questions: langue/questions.md
      - Fabriquer des noms: langue/derivation.md
      - Le lexique: langue/lexique.md
  - Conjuguer un verbe: conjuguer.md
  - Traduire: comprendre.md
  - Le corpus: corpus.md
  - Le moteur: moteur.md
  - Crédits et licences: credits.md
  - Le projet:
      - Notes de recherche: projet/recherche.md
      - Ressources: projet/sources.md
      - Premier texte: projet/texte_01.md
      - Texte à traduire (3): projet/texte_03_a_traduire.md
      - Texte à traduire (4): projet/texte_04_a_traduire.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc: {permalink: true}
