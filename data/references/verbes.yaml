# Inventaire de TOUS les verbes rencontrés, pour ne rien perdre.
# Ce fichier n'est PAS lu par le moteur. Les verbes conjugables sont dans
# data/grammaire/soninke.yaml ; un verbe y passe quand son radical (et au besoin
# son gérondif) est confirmé par le locuteur.
#
# locuteur : donné par le locuteur, infos incomplètes
# sources  : trouvé dans une ressource (autre dialecte possible), à confirmer.
#            Champs : radical, fr, gerondif (inaccompli), intransitif (-i), antipassif (-ndi), ref.

locuteur:
- radical: mini
  fr: boire
  exemple: ake m'mini (il a bu)
  source: 'serie_02 #24'
  manque: infinitif
- radical: goli
  fr: travailler
  exemple: ake n'goli (il a travaillé)
  source: 'serie_02 #28, serie_03 #3'
  manque: infinitif ; variante ake n'golinia ?
- radical: wori
  fr: voir
  exemple: ake n'di lemine n'wori (il a vu l'enfant)
  source: 'serie_02 #26'
  manque: infinitif
- radical: xenxe
  fr: dormir
  exemple: ake n'xenxe (il a dormi)
  source: 'serie_02 #25, serie_03 #4'
  manque: infinitif
  note: '« anke xenxe » était une erreur : la particule s''applique'
- radical: mara
  fr: '?'
  exemple: m'mara
  source: message du 2026-09-16 (maréer)
  manque: sens
- radical: '?'
  fr: arriver
  source: 'serie_02 #27'
  manque: tout
- radical: mama
  fr: faire mal
