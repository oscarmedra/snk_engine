questions:
  - {snk: "An toxo ?", fr: "Quel est ton nom ?"}
  - {snk: "An janmu ?", fr: "Ton nom de famille ?"}
  - {snk: "Ko ni ?", fr: "C'est qui ?"}
  - {snk: "Mani ni ?", fr: "C'est quoi ?"}
  - {snk: "Manime ni ?", fr: "C'est combien ?"}
  - {snk: "An wa telle minna ?", fr: "Où vas-tu ?"}
  - {snk: "Saxan na minna ?", fr: "Où est le marché ?"}
  - {snk: "An w'in tu ba ?", fr: "Tu me connais ?"}
  - {snk: "Yaqen w'an maxa ba ?", fr: "As-tu une femme ?"}
  - {snk: "Kan bire ?", fr: "Quand ?"}

salutations:
  - {snk: "nawaari", fr: "salut"}
  - {snk: "anba", fr: "merci (réponse d'un homme)", variante: "nba, marahaba"}
  - {snk: "yawuri", fr: "merci (réponse d'une femme)"}
  - {snk: "An moxo ?", fr: "Comment vas-tu ?", variante: "An xubaare ?"}
  - {snk: "Ma jamu.", fr: "Ça va."}
  - {snk: "Ma jamu baane.", fr: "Très bien."}
  - {snk: "An wuyi jamu ?", fr: "Bien dormi ?"}
  - {snk: "Beeta !", fr: "Bonjour ! (le matin vers 10 h)"}
  - {snk: "Xa sunka.", fr: "Bonsoir à vous tous."}
  - {snk: "Bisimilla !", fr: "Bienvenue !"}
  - {snk: "Katta kaane.", fr: "À bientôt.", variante: "Katti kaane."}
  - {snk: "N daga.", fr: "Je m'en vais."}
