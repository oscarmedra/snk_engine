# « O nan sefe sooninken do faransen ŋa / Parlons le soninké et le français »
# Marianne Hagg, SIL Mali, 2e édition révisée, janvier 2016 (1re éd. avril 2015).
# © SIL Mali 2015, 2016 — adapté du dogon Toro So de Zacharie Togo.
#
# ATTENTION : la dernière page précise « Orthographe : soninké du Mali ». Ce n'est
# donc pas forcément la variété du locuteur du projet. Le fichier est une SOURCE
# EXTERNE : rien n'en sort pour le moteur sans arbitrage mot à mot du locuteur.
# Voir scripts/comparer_hagg.py, qui confronte chaque entrée aux données du projet.

source:
  titre: "O nan sefe sooninken do faransen ŋa"
  auteur: Marianne Hagg
  editeur: SIL Mali
  edition: "2e, janvier 2016"
  orthographe: "soninké du Mali (déclaré par l'ouvrage)"
  valide_par_locuteur: "2026-10-29 — comme bonne source, pas entrée par entrée"

famille:
  - {snk: kaagume, fr: le chef de famille}
  - {snk: faabe, fr: le père, variante: "n faaba (mon père)"}
  - {snk: saaxe, fr: la mère, variante: "n ma (ma mère)"}
  - {snk: kiine, fr: le mari, variante: "n kiina (mon mari)"}
  - {snk: yaqe, fr: une femme, variante: kaagunyaxare}
  - {snk: renme, fr: un enfant}
  - {snk: renyugo, fr: un fils}
  - {snk: renyaxare, fr: une fille}
  - {snk: gidanyugo, fr: un grand frère}
  - {snk: gidanyaxare, fr: une grande sœur}
  - {snk: xoxone, fr: un petit frère, variante: "une petite sœur"}
  - {snk: kisima, fr: un grand-père}
  - {snk: maama, fr: une grand-mère}
  - {snk: neega, fr: un oncle maternel, variante: kaawu}
  - {snk: baayi, fr: une tante (sœur du père)}
  - {snk: maaxoore, fr: une tante (grande sœur de la mère)}
  - {snk: maarenme, fr: un parent}
  - {snk: kallo, fr: beau-père, variante: "kallu ; belle-mère, gendre"}
  - {snk: kallungoora, fr: un cousin à plaisanterie}
  - {snk: menjanŋe, fr: un ami}
  - {snk: yugo, fr: un homme}
  - {snk: yaxare, fr: une femme}
  - {snk: lemine, fr: un petit enfant}

