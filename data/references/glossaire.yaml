# Glossaire soninké-français, importé d'un PDF fourni par le locuteur
# (2026-10-29) et converti par scripts/importer_glossaire.py.
#
# Graphie du glossaire : `nn` là où la norme malienne écrit `nŋ`, et `ñ`
# pour `ɲ` — usage du Sénégal, de Gambie ou de Mauritanie. Ce n'est donc
# pas forcément la variété du locuteur : SOURCE EXTERNE, rien n'entre dans
# le moteur sans son arbitrage.
#
# `forme2` : la seconde forme donnée entre parenthèses — pour un verbe, sa
# forme en -ni ; `nombre` : les marques de singulier et de pluriel.

